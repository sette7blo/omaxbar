name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck -S warning install.sh uninstall.sh bin/omaxbar-config bin/omaxbar-toggle

      - name: Validate manifest
        run: jq -e '.id and .name and .version and .entryPoints.barWidget' manifest.json

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches manifest version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(jq -r .version manifest.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match manifest.json version $VERSION" >&2
            exit 1
          fi

      - name: Extract release notes
        id: release_notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^(## |\[)/{exit} found{print}" CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "No CHANGELOG.md section for $TAG" >&2
            exit 1
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release_notes.outputs.notes }}
